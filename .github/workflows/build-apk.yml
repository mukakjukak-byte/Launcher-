name: Build APK

on:
  push:
    paths-ignore:
      - 'cache/**'
      - 'pc/**'
      - 'cache-pc/**'
      - '.github/workflows/build-pc.yml'
      - '.github/workflows/publish-cache.yml'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CrmpLauncher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CrmpLauncher-apk
          path: CrmpLauncher.apk

      # Публикуем APK в релиз "launcher" — оттуда его можно скачать прямо на телефон
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher
          name: CRMP Launcher (последняя сборка)
          body: |
            Автосборка из коммита ${{ github.sha }}.
            Скачай CrmpLauncher.apk и установи на телефон.
          files: CrmpLauncher.apk
          make_latest: true
